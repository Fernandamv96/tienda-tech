name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test -- --watchAll=false --passWithNoTests
      - name: Lint + build (react-scripts; CI=true convierte avisos de ESLint en errores)
        env:
          CI: 'true'
        run: npm run build
